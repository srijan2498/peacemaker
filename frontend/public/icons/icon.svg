<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cozyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <filter id="cozyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312E81" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#cozyGrad)" />

  <!-- Subtle Ambient Glow Ring -->
  <circle cx="256" cy="256" r="190" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" fill="none" />

  <!-- Main House / Sanctuary Emblem -->
  <g filter="url(#cozyShadow)">
    <!-- House Roof Architecture -->
    <path
      d="M256 128 L144 224 C136 230 136 242 144 248 C152 254 162 252 168 246 L256 170 L344 246 C350 252 360 254 368 248 C376 242 376 230 368 224 Z"
      fill="url(#roofGrad)"
    />

    <!-- House Body Structure with Smooth Nest Curve -->
    <path
      d="M168 236 L168 340 C168 368 190 390 218 390 L294 390 C322 390 344 368 344 340 L344 236 L256 160 Z"
      fill="rgba(255, 255, 255, 0.95)"
    />

    <!-- Chimney -->
    <rect x="312" y="160" width="24" height="40" rx="6" fill="rgba(255, 255, 255, 0.9)" />

    <!-- Center Warm Nest Heart -->
    <path
      d="M256 270 C256 248 232 236 216 252 C200 268 212 292 256 332 C300 292 312 268 296 252 C280 236 256 248 256 270 Z"
      fill="url(#heartGrad)"
    />

    <!-- Door / Foundation Arch -->
    <path
      d="M236 390 L236 348 C236 338 244 330 256 330 C268 330 276 338 276 348 L276 390 Z"
      fill="#4338CA"
    />
  </g>

  <!-- Stars of Care & Protection -->
  <circle cx="160" cy="148" r="6" fill="#FDE047" opacity="0.9" />
  <circle cx="360" cy="132" r="8" fill="#FDE047" opacity="0.9" />
</svg>
